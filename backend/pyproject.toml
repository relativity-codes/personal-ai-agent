[project]
name = "personal-ai-agent-backend"
version = "0.1.0"
description = "Personal AI Agent API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "psycopg2-binary>=2.9.12",
    "PyJWT[crypto]>=2.9",
    "langgraph>=0.2",
    "svix>=1.0",
    "python-decouple>=3.8",
    "google-auth>=2.30",
    "openai>=1.0",
    "notion-client>=2.2.1",
    "google-api-python-client>=2.128.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
deploy = [
    "zappa>=0.62.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: exercises real external APIs using values from backend/.env",
]
